[package]
name = "taotao-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "taotao_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 自动更新（签名校验）。安装后用 AppHandle::restart 重启，无需 process 插件。
tauri-plugin-updater = "2"
# 单实例：二次启动时把已有窗口唤到前台后退出新进程，避免同机多开造成重复上报/抢占音频。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 前端 fetch 走 Rust 侧直连后端：webview 的 window.fetch 受 CORS 约束，
# 而服务端按安全设计默认不下发 CORS 头，跨源请求的预检必挂。
tauri-plugin-http = "2"
# 传输加密：直接用同仓 Rust core，不走 JNI/.dll。
#
# 开启 `antidebug`：这是**分发给用户的 Windows 客户端产物**，攻击者有物理设备。
# 检测到调试器 / 注入框架即 `abort()`（见 crypto-src/core/src/antidebug.rs 的
# 模块文档，含「为什么服务端与 wasm 不开」）。
#
# 注意这里**没有**开 `obfuscate`（字符串混淆）—— 与改动前一致。是否该开是另一
# 个独立问题（桌面端产物同样是分发出去的），本次不顺手改，避免把两件事混在
# 一次改动里。
taotao-crypto-core = { path = "../../crypto-src/core", features = ["antidebug"] }
# 轻量阻塞 HTTP（握手/取 PSK 用）；json feature 提供 send_json。
ureq = { version = "2", features = ["tls", "json"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# 读注册表 HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid 作设备号。
winreg = "0.52"

[profile.release]
opt-level = "s"
# thin LTO：比 fat 快不少、体积几乎一样小，CI 编译更快。
lto = "thin"
codegen-units = 1
strip = true
