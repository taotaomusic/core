[package]
name = "taotao-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "taotao_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 传输加密：直接用同仓 Rust core，不走 JNI/.dll。
taotao-crypto-core = { path = "../../crypto-src/core" }
# 轻量阻塞 HTTP（握手/取 PSK 用）；json feature 提供 send_json。
ureq = { version = "2", features = ["tls", "json"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# 读注册表 HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid 作设备号。
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
