# 后端 CI：验证云端能完成 NestJS 构建（tsc + 产物压缩 + 管理后台 vite），
# 并起一个验证实例跑完整契约验证（tools/verify-contract.mjs，全绿才算过）。
# 本文件位于 server/.github/，随 tools/sync-repos.ps1 的快照成为
# github.com/hdppppppp/music-server 根下的 .github/workflows/backend.yml。
#
# 环境变量取值口径与 server/tools/verify-contract.mjs 文件头记录的本地验证流程一致。
# 分享播放器（Kotlin/Wasm）从 music 仓库的固定 Release（share-player-latest）拉取真实
# 产物；拉不到时退回占位文件（见下方步骤内注释），后端 CI 不被前端仓库牵连。
#
# 失败可见性：Actions 日志下载需要仓库管理员令牌，匿名只能读到注解（annotations），
# 所以启动/契约失败时把关键日志行用 `::error::` 吐成注解，便于外部工具轮询排查。
name: 后端构建与契约验证

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 推送镜像到 GitHub Container Registry（ghcr.io）需要写 packages。
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_verify
      # 注意必须带引号：不带引号的纯数字串会被 YAML 解析成浮点数，
      # 传给服务端变成科学计数法字符串，过不了「至少 32 字符」校验（实际踩过）。
      AUTH_SECRET: "0123456789abcdefghij0123456789abcdefghij"
      ADMIN_INITIAL_PASSWORD: verify-initial-123456
      NODE_ENV: test
      PORT: "4720"
      APK_DIR: ./tmp/apk
      EMAIL_VERIFICATION_TEST_CODE: "123456"
      IM_ENABLED: "false"
      ADMIN_RATE_LIMIT: "1000"
      CORS_ALLOWED_ORIGINS: https://verify.example

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（tsc + minify + copy-manifest + 管理后台 vite）
        run: npm run build

      - name: 拉取 music 仓库最新构建的分享播放器
        run: |
          # music 仓库的 client.yml 每次构建都会把真实 wasm 播放器发布到
          # 固定 tag 的 Release（share-player-latest），这里免登录直接拉。
          # 双仓同推送触发时 music 的构建更慢，拉到的通常是上一轮产物 ——
          # 服务端启动时按内容做指纹版本化，跨批次不会混。
          if curl -fsSL -o /tmp/share-player.zip \
              https://github.com/hdppppppp/music/releases/download/share-player-latest/share-player.zip; then
            rm -rf dist/share-player
            mkdir -p dist/share-player
            unzip -q /tmp/share-player.zip -d dist/share-player
            echo "已拉取真实分享播放器（music 仓库 share-player-latest）"
          else
            echo "::warning::拉取分享播放器失败（music 仓库尚未发布过），退回占位文件，仅够缓存头断言"
            mkdir -p dist/share-player
            printf '/* 契约验证占位：独立后端仓库没有 Kotlin/Wasm 产物，仅用于静态缓存头断言 */\n' \
              > dist/share-player/taotao-share-player.js
            printf 'wasm-placeholder' > dist/share-player/TaotaoMusic-webApp-wasm-js.wasm
            printf '<!doctype html><html lang="zh-CN"><head><base href="/share/"><meta charset="utf-8"><title>占位</title></head><body>契约验证占位页面</body></html>' \
              > dist/share-player/index.html
          fi

      - name: 拉取加密层原生产物（Linux + Windows，供传输加密，缺失则明文降级）
        run: |
          # 与客户端拉 .so 同款流转：从 tools 固定版本 Release 取两个平台的
          # taotao_crypto.node，放到 native-loader 会按平台查的
          # crypto/dist/node/<平台>/。两个都打进 server-dist.zip 与 Docker 镜像，
          # 这样同一份产物在 Linux 和 Windows 部署都能直接用（native-loader 自动选平台）。
          # PSK 仍走运行时环境变量（CRYPTO_PSK_*），密钥不进产物。拉不到不阻断。
          # 版本随加密层发布单调更新（规则见 tools 仓库 docs/versioning.md）。
          CRYPTO_VER=v2.3.0
          for plat in linux-x64 windows-x64; do
            mkdir -p "crypto/dist/node/$plat"
            if curl -fsSL -o "/tmp/node-$plat.zip" \
                "https://github.com/hdppppppp/tools/releases/download/$CRYPTO_VER/node-$plat.zip"; then
              unzip -qo "/tmp/node-$plat.zip" -d "crypto/dist/node/$plat"
              echo "已拉取 taotao_crypto.node（$plat, $CRYPTO_VER）"
            else
              echo "::warning::拉取 $plat 加密产物失败（$CRYPTO_VER 可能尚未发布），该平台传输加密将明文降级"
            fi
          done
          ls -R crypto/dist/node || true

      - name: 重置验证库
        run: node tools/reset-db.mjs "$DATABASE_URL"

      - name: 启动验证实例
        run: |
          node dist/main.js > server.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4720/health | grep -q '"up"'; then
              ok=1
              echo "服务已就绪（第 ${i}s）"
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "服务 60 秒内未就绪，日志尾部如下："
            tail -n 12 server.log || true
            grep -m 1 -i 'error' server.log | head -c 300 || true
            tail -n 10 server.log | while IFS= read -r line; do
              if [ -z "$line" ]; then line="(空行)"; fi
              echo "::error::${line:0:300}"
            done
            exit 1
          fi

      - name: 契约验证
        run: node tools/verify-contract.mjs http://127.0.0.1:4720 2>&1 | tee verify.log

      - name: 发布 dist 到 Release server-dist-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 契约全绿才走到这里。打包布局刻意「扁平」：把 dist/ 的内容放到 zip 根，
          # 再并入 crypto/。这样解压到部署目录（如 /www/wwwroot/music）后就是
          #   /www/wwwroot/music/main.js
          #   /www/wwwroot/music/crypto/dist/node/<平台>/taotao_crypto.node
          # 从该目录直接 `node main.js` 启动（cwd 即部署目录），native-loader 按
          # <cwd>/crypto/dist/node/<平台>/ 命中，自动选 Linux/Windows。
          rm -f server-dist.zip
          ( cd dist && zip -qr "$OLDPWD/server-dist.zip" . )
          zip -qr server-dist.zip crypto
          gh release view server-dist-latest >/dev/null 2>&1 || \
            gh release create server-dist-latest --prerelease \
              --title "后端 dist 最新构建" \
              --notes "npm run build 的完整产物（tsc + 压缩 + 管理后台 vite + 分享播放器）+ 两平台 taotao_crypto.node，契约验证通过后发布。扁平布局：解压到部署目录即得 main.js 与 crypto/，从该目录 node main.js 启动。生产依赖按 server/README.md 安装。"
          gh release upload server-dist-latest server-dist.zip --clobber
          echo "已发布 server-dist-latest/server-dist.zip"

      - name: 构建并推送 Docker 镜像到 ghcr.io
        # 只在 push 到 main 时推镜像；手动触发（workflow_dispatch）只验证不推。
        # 走到这一步说明契约已全绿，dist/ 是验证过的那份，Dockerfile 直接复用它。
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 版本号单一来源：package.json 的 version（手动 SemVer 维护）。
          # 镜像同时打三个 tag：版本号（人读、可回滚到具体版本）、
          # sha 前 12 位（精确可追溯到提交）、latest（部署默认拉取）。
          VERSION=$(node -p "require('./package.json').version")
          # ghcr 镜像名必须全小写；仓库名已是小写，这里再兜底转一次。
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:${GITHUB_SHA::12}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:${GITHUB_SHA::12}"
          echo "已推送镜像：$IMAGE 的 latest / $VERSION / ${GITHUB_SHA::12}"

      - name: 契约失败时输出摘要注解
        if: failure()
        run: |
          if [ -f verify.log ]; then
            tail -n 2 verify.log | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            grep -v '✓' verify.log | grep -E '✗|✘|失败|Error|error' | tail -n 8 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
          fi

      - name: 失败时保留服务日志
        if: failure()
        run: tail -n 100 server.log || true
