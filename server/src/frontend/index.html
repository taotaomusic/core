<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桃桃音乐 - 主页面</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/element-plus@latest/dist/index.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/vue@next"></script>
    <script>
      import { createApp } from "vue";
      import ElementPlus from "element-plus";
      import "element-plus/dist/index.css";

      const app = createApp({
        template: `
          <div class="main-page">
            <h1>桃桃音乐主页面</h1>
            <p>欢迎使用桃桃音乐</p>
          </div>
        `,
      });
      app.use(ElementPlus);
      app.mount("#app");
    </script>
  </body>
</html>
