<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>桃桃音乐 - 后台管理</title>
    <style>
      /* 防止在移动端切换暗色模式时出现白屏闪烁 */
      html { background-color: #f5f7fa; }
      html.dark { background-color: #141414; color-scheme: dark; }
    </style>
    <!--
      主题预置脚本外置成独立文件（见 public/theme-bootstrap.js）。

      它原本是内联的 <script>，但内联脚本会逼着 CSP 放开 script-src 'unsafe-inline'，
      而那一条正好抵消了 CSP 对 XSS 的全部防护。外置之后服务端可以只允许 'self'。
      必须保持同步阻塞（不加 defer/async），否则会晚于首屏渲染，暗色模式闪烁就回来了。
    -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
