# 客户端 CI：验证云端能产出 Android APK 与 Windows 桌面更新包。
# 本文件随 tools/sync-repos.ps1 的快照进入 github.com/hdppppppp/music，在镜像仓库生效。
#
# 说明：
# - 必须用 Windows runner：androidApp 的 incrementVersion 通过 `powershell` 调
#   tools/Update-Version.ps1，Linux runner 上没有这个命令会导致构建收尾失败。
# - 签名：Secrets 配了 ANDROID_KEYSTORE_BASE64（taotao-release.jks 的 base64）、
#   ANDROID_STORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD 时自动还原
#   local.properties 出签名 Release 包；未配置时退回 Debug 包，仅验证工具链。
# - 桌面包用 JDK 自带的 jpackage/jlink（:desktopApp:packageDesktopUpdateBundle），
#   不需要 GraalVM；GraalVM 原生入口是可选项，CI 不构建。
name: 客户端构建（APK + Windows 桌面包）

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 还原发布签名（未配 Secrets 时退回 Debug 包）
        id: signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=false"
            Write-Host "未配置签名 Secrets，改出 Debug 包验证工具链"
          } else {
            [IO.File]::WriteAllBytes("taotao-release.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            @(
              "TAOTAO_STORE_PASSWORD=$env:ANDROID_STORE_PASSWORD",
              "TAOTAO_KEY_ALIAS=$env:ANDROID_KEY_ALIAS",
              "TAOTAO_KEY_PASSWORD=$env:ANDROID_KEY_PASSWORD"
            ) | Set-Content -Path local.properties
            Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=true"
            Write-Host "已还原发布签名（taotao-release.jks + local.properties）"
          }

      - name: 构建 APK
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if ($env:SIGNED -eq "true") {
            .\gradlew.bat :androidApp:assembleRelease
          } else {
            .\gradlew.bat :androidApp:assembleDebug
          }

      - name: 列出 APK 产物
        shell: pwsh
        run: Get-ChildItem -Recurse androidApp/build/outputs/apk -Filter *.apk | Format-Table FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

  desktop-exe:
    name: Windows 桌面更新包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 构建桌面更新包（含 launcher.exe / updater.exe）
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageDesktopUpdateBundle

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-update-bundle
          path: desktopApp/build/desktop-update-bundle/
          if-no-files-found: error

  # Kotlin/Wasm 分享播放器单独构建并发布成固定 tag 的 Release（share-player-latest），
  # 供 music-server 后端在构建时免登录拉取（与 tools/fetch-crypto.ps1 的流转方式同款）。
  # 每次构建覆盖同名资产；后端在启动时对内容做指纹版本化，跨批次不会混。
  # 用 Windows runner：这个任务只在本地 Windows 上被日常验证过（build:web-player），
  # Ubuntu 上 wasm 工具链行为未验证（实际挂过两次），失败时用注解吐出错误行。
  web-player:
    name: Web 分享播放器
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 Kotlin/Wasm 分享播放器
        shell: pwsh
        run: |
          cmd /c ".\gradlew.bat :webApp:wasmJsBrowserDistribution --no-daemon > wasm-build.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "构建失败，错误摘要："
            Select-String -Path wasm-build.log -Pattern '^e:','What went wrong','Caused by:','> Task .* FAILED' |
              Select-Object -Last 8 | ForEach-Object {
                $line = $_.Line
                if ($line.Length -gt 300) { $line = $line.Substring(0, 300) }
                Write-Output "::error::$line"
              }
            Get-Content wasm-build.log -Tail 40
            exit 1
          }
          Get-Content wasm-build.log -Tail 15

      - name: 打包 share-player.zip（tar -a 保证 zip 内是正斜杠路径）
        shell: pwsh
        run: |
          $src = "webApp/build/dist/wasmJs/productionExecutable"
          if (-not (Test-Path "$src/index.html")) { throw "构建产物缺少 index.html" }
          tar -a -cf share-player.zip -C $src .

      - name: 发布到 Release share-player-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view share-player-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create share-player-latest --prerelease `
              --title "share-player 最新构建" `
              --notes "自动构建的 Kotlin/Wasm 分享播放器，供 music-server 构建时拉取；固定 tag，资产随每次客户端构建覆盖"
          }
          gh release upload share-player-latest share-player.zip --clobber
          Write-Host "已发布 share-player-latest/share-player.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: share-player
          path: webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
