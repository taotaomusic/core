name: CI（统一按需构建）

# taotaomusic/core 单仓统一流水线：一处改动只构建相关部分。
# - crypto-src/** 变 → 构建加密产物（.so/.node）并作为 run artifact 供下游取用
# - server/**   变 → 后端构建 + 契约验证 + Docker
# - 客户端目录  变 → Android APK + 桌面包
# 加密产物同一次 run 内经 upload/download-artifact 流转，不再跨仓/Release 拉取。
# PSK 已由后端动态下发，产物不含密钥，故无需注入 TAOTAO_CRYPTO_PSK。

# 触发：push 到 main（正式产出）+ pull_request 到 main（只验证、不发布）。
# PR 上所有「发布 / 删 Release / 回写仓库」的步骤都被 github.event_name == 'push' 挡住。
# fork PR 拿不到 Secrets 且 GITHUB_TOKEN 只读，是第二层兜底；同仓分支 PR 的作者本就
# 有写权限，所以「PR 能跑工作流」不构成权限提升。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: '强制全量构建（等同提交信息里的 [full]）'
        type: boolean
        default: false
      purge:
        description: '删除全部 Release 后由本次运行重建（危险，仅手动勾选）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.flag.outputs.full }}
      crypto: ${{ steps.f.outputs.crypto == 'true' || steps.flag.outputs.full == 'true' }}
      server: ${{ steps.f.outputs.server == 'true' || steps.flag.outputs.full == 'true' }}
      client: ${{ steps.f.outputs.client == 'true' || steps.flag.outputs.full == 'true' }}
      desktop: ${{ steps.f.outputs.desktop == 'true' || steps.flag.outputs.full == 'true' }}
      autopatch: ${{ steps.f.outputs.autopatch == 'true' || steps.flag.outputs.full == 'true' }}
    steps:
      # 只把表达式求值出的**布尔字面量**写进 shell，绝不内联提交信息原文 ——
      # 提交信息是可控输入，直接插值进脚本就是注入面。contains() 的结果只会是
      # true/false 之一，不含原文。
      # 另：pull_request 事件没有 head_commit，所以 PR 上 [full] 天然不生效；
      # 需要全量时用手动 dispatch 的 full 输入。
      - name: 判定全量开关
        id: flag
        shell: bash
        run: |
          full=false
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ contains(github.event.head_commit.message, '[full]') }}" = "true" ]; then
            full=true
          fi
          if [ "${{ inputs.full }}" = "true" ]; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "全量构建开关：$full"
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          # ⚠️ 这里没有也不该有 '.github/**'：改工作流本身不该触发任何产品构建。
          # 代价是「只改 ci.yml 的提交」会让全部 job 跳过 —— run 显示 success 但
          # 什么都没验证。要验证工作流改动，用 workflow_dispatch 勾选 full，
          # 或在提交信息里写 [full]。
          filters: |
            crypto:
              - 'crypto-src/**'
            server:
              - 'server/**'
            desktop:
              - 'desktop/**'
            autopatch:
              - 'autopatch/**'
            client:
              - 'androidApp/**'
              - 'webApp/**'
              - 'player-ui/**'
              - 'shared/**'
              - 'build-logic/**'
              - 'patch/**'
              - 'gradle/**'
              - '*.gradle*'
              - 'gradle.properties'
              - 'settings.gradle*'
              - 'version.properties'
              - 'crypto/**'

  # PLACEHOLDER_JOBS
  autopatch:
    needs: [changes, purge]
    if: needs.changes.outputs.autopatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # autopatch 是独立 JVM 工程（自带 settings），纯 ASM + JDK，不需要 Android SDK。
      # 借用根 gradle wrapper，-p 指向它自己的构建根。
      - name: 测试 autopatch 补丁生成器
        run: ./gradlew -p autopatch test --console=plain --no-daemon
      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopatch-test-report
          path: autopatch/build/reports/tests/test/
          if-no-files-found: ignore

  # 本 job 必须保持「一定会被执行到」（只有步骤被挡住）：needs: purge 的下游 job
  # 在依赖被 skip 时会跟着 skip，所以不能把 if 提到 job 级。
  purge:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 原先由提交信息里的 [purge] 触发 —— 任何能推 main 的人（含被盗账号、被劫持的
      # 自动化）只要在提交信息里写 [purge] 就能删光全部 Release。改成手动 dispatch 勾选。
      - name: 删除全部旧 Release（仅手动 dispatch 勾选 purge；随后各 job 重建）
        if: github.event_name == 'workflow_dispatch' && inputs.purge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 300 --json tagName -q '.[].tagName' | while read -r t; do
            [ -n "$t" ] && { echo "删除 $t"; gh release delete "$t" --cleanup-tag -y || true; }
          done

  crypto:
    needs: [changes, purge]
    if: needs.changes.outputs.crypto == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 27.2.12479018
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: crypto-src
    steps:
      - uses: actions/checkout@v4
      # 产物缓存:按 crypto-src 全部源码哈希做 key。rust 没变 → 命中 → 跳过下面全部重活
      # (工具链/NDK/编译/校验),只把缓存里的 out/ 直接 upload 给下游 client/server/desktop。
      # out/ 相对 workspace,不受 job 的 working-directory 影响(与 upload-artifact 路径一致)。
      - name: 复用 crypto 产物(源码未变时跳过编译)
        id: crypto-cache
        uses: actions/cache@v4
        with:
          path: crypto-src/out
          key: crypto-out-${{ hashFiles('crypto-src/**') }}
      # SHA 固定：@stable 是**分支**引用，上游任何一次推送都直接进入我们的构建。
      # 固定后必须显式给 toolchain 输入，否则 action 无法从 ref 名推断工具链。
      # SHA 必须取自 master 分支历史（dtolnay 明确要求：不在 master 历史里的提交会被 GC）。
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        with:
          workspaces: crypto-src
          key: unified-crypto
      - name: 缓存 Android NDK（省去每次约 700MB 下载安装）
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: 格式 / Clippy / 单元测试
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --lib
      - name: 安装 Android NDK
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE=""
          for d in "$SDK"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then CMDLINE="$d"; break; fi
          done
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null 2>&1 || true
          echo "NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: 构建 Android .so（仅 arm64-v8a；APK 只打包这个 ABI）
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        env:
          # CRYPTIFY_KEY 只在真正构建 .so 时设：字符串混淆的编译期密钥。
          # **不能**放到 job 级 env，否则 fmt/clippy/test 步骤也带上它——
          # cargo --workspace 的 feature 统一会让 core 编译时开启 obfuscate，
          # 而 cryptify 用自定义 key 时会改写 `{}` 模板，触发 obf_string! 的
          # 占位符自检 panic（core CI 曾因此挂在 rejects_bad_psk_id）。
          CRYPTIFY_KEY: ${{ secrets.CRYPTIFY_KEY }}
        run: |
          # 只编 arm64-v8a：androidApp 的 abiFilters 只保留 arm64-v8a，x86_64 的 .so
          # 编了也不会进 APK，纯浪费一次交叉编译。省掉它明显加快 crypto job。
          cargo build --release --target aarch64-linux-android -p taotao-crypto-jni
          mkdir -p out/android/arm64-v8a
          cp target/aarch64-linux-android/release/libtaotao_crypto_jni.so out/android/arm64-v8a/libtaotao_crypto.so
      - name: 构建 Node .node（linux-x64）
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release -p taotao-crypto-node
          mkdir -p out/node/linux-x64
          cp target/release/libtaotao_crypto_node.so out/node/linux-x64/taotao_crypto.node
      - name: 校验字符串混淆（KDF 标签已明文，见脚本）
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        run: bash tools/check-obfuscated.sh out/android/arm64-v8a/libtaotao_crypto.so
      - name: 端到端冒烟（node）
        if: steps.crypto-cache.outputs.cache-hit != 'true'
        run: node tools/smoke-test.cjs out/node/linux-x64/taotao_crypto.node
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-android
          path: crypto-src/out/android
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-node-linux
          path: crypto-src/out/node
          if-no-files-found: error
      - name: 发布 crypto-latest（本地开发 fetch-crypto 用）
        if: github.event_name == 'push' && steps.crypto-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          (cd android && zip -qr "$OLDPWD/android.zip" .)
          (cd node/linux-x64 && zip -qr "$OLDPWD/node-linux-x64.zip" .)
          gh release view crypto-latest >/dev/null 2>&1 || gh release create crypto-latest --prerelease --title "加密模块" --notes "版本历史"
          gh release upload crypto-latest android.zip node-linux-x64.zip --clobber
          cd ..
          cver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          bash ../tools/release-log.sh crypto-latest "加密模块" "$cver"

  # PLACEHOLDER_SERVER
  server:
    needs: [changes, crypto]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.crypto == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_verify
      AUTH_SECRET: "0123456789abcdefghij0123456789abcdefghij"
      ADMIN_INITIAL_PASSWORD: verify-initial-123456
      NODE_ENV: test
      PORT: "4720"
      APK_DIR: ./tmp/apk
      EMAIL_VERIFICATION_TEST_CODE: "123456"
      IM_ENABLED: "false"
      ADMIN_RATE_LIMIT: "1000"
      CORS_ALLOWED_ORIGINS: https://verify.example
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 取加密 .node（同 run crypto 产物）
        uses: actions/download-artifact@v4
        with:
          name: crypto-node-linux
          path: server/crypto/dist/node
      - name: 安装依赖
        run: npm ci
      - name: 自动版本号（根 VERSION + 构建号）
        run: |
          base=$(tr -d '[:space:]' < ../VERSION)
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json'));j.version='${base}.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n');console.log('server version =>',j.version)"
      - name: 构建
        env:
          # 后端不自建 wasm 播放器（core 单仓里上级有 Gradle 工程会误触发）；
          # 分享播放器由 client-web job 构建并发 Release，下一步拉取。
          SKIP_WEB_PLAYER: "1"
          # job 级的 NODE_ENV=test 会被 vite 静态替换进浏览器产物，React 由此打进
          # development 构建（体积翻倍、带运行时警告）。构建必须是生产包；
          # 契约验证是独立 step，继续用 job 级的 test，互不影响。
          NODE_ENV: production
        run: npm run build
      - name: 拉取分享播放器（本仓库 share-player-latest）
        run: |
          # 分享播放器由 client-web job 构建并发布到**本仓库**的 share-player-latest
          # Release。旧的 hdppppppp/music 镜像仓已冻结（资产停在 2026-09-27），不要再回去拉。
          # 用 ${{ github.repository }} 而不是写死仓库名：改名/迁移时这里不用跟着改。
          if curl -fsSL -o /tmp/share-player.zip \
              "https://github.com/${{ github.repository }}/releases/download/share-player-latest/share-player.zip"; then
            rm -rf dist/share-player; mkdir -p dist/share-player
            unzip -q /tmp/share-player.zip -d dist/share-player
            echo "已拉取分享播放器 $(du -sh dist/share-player | cut -f1)"
          else
            # 落到占位文件时契约里的「分享页缓存头」断言等于什么都没验证，必须显式告警，
            # 否则 CI 全绿但分享页其实是坏的。
            echo "::warning::未取到 share-player-latest，退回占位文件 —— 分享页相关断言本次无效"
            mkdir -p dist/share-player
            printf '/* placeholder */\n' > dist/share-player/taotao-share-player.js
            printf 'wasm-placeholder' > dist/share-player/TaotaoMusic-webApp-wasm-js.wasm
            printf '<!doctype html><title>占位</title>' > dist/share-player/index.html
          fi
      - name: 重置验证库
        run: node tools/reset-db.mjs "$DATABASE_URL"
      - name: 启动验证实例
        run: |
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4720/health | grep -q '"up"'; then echo "就绪($i s)"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4720/health | grep -q '"up"' || { tail -n 20 server.log; exit 1; }
      - name: 契约验证
        run: node tools/verify-contract.mjs http://127.0.0.1:4720 2>&1 | tee verify.log
      - name: 发布 dist（滚动 + 版本化）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f server-dist.zip
          ( cd dist && zip -qr "$OLDPWD/server-dist.zip" . )
          zip -qr server-dist.zip crypto
          gh release view server-dist-latest >/dev/null 2>&1 || \
            gh release create server-dist-latest --prerelease --title "后端" --notes "版本历史"
          gh release upload server-dist-latest server-dist.zip --clobber
          bash ../tools/release-log.sh server-dist-latest "后端" "$(node -p "require('./package.json').version")"
      - name: 构建并推送 Docker 镜像到 ghcr.io
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 镜像名跟随仓库（ghcr.io/taotaomusic/core）。2026-09-30 该包的 Actions 写授权曾被改坏
          # （稳定报 permission_denied: write_package，且包 ACL 无 API 只能网页修），期间临时改推
          # taotaomusic/music-server（冻结在 1.0.47，可在包设置删除）；授权恢复后已切回本包。
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          VER=$(node -p "require('./package.json').version")
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:$VER" -t "$IMAGE:${GITHUB_SHA::12}" .
          docker push "$IMAGE:latest"; docker push "$IMAGE:$VER"; docker push "$IMAGE:${GITHUB_SHA::12}"
      - name: 失败时输出日志
        if: failure()
        run: tail -n 60 server.log verify.log 2>/dev/null || true

  # PLACEHOLDER_CLIENT
  client-android:
    needs: [changes, crypto]
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.crypto == 'true'
    # 用 Linux：Android 构建平台无关，而 Windows runner 有两个实打实的坑 ——
    # ① setup-java 的 gradle 缓存在 Windows 上保存必然失败（tar 打包 ~/.gradle 时
    #    撞上 modules-2.lock 文件锁，Device or resource busy），缓存从未真正落盘，
    #    每天都是冷构建；② Windows runner 的 IO/CPU 本身更慢。
    # 旧 music 仓 client.yml 必须 Windows 的唯一理由（incrementVersion 走 powershell）
    # 在 core 里已不存在，签名还原与版本号生成均已用 bash/node 重写，跨平台。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      vn: ${{ steps.prep.outputs.vn }}
      vc: ${{ steps.prep.outputs.vc }}
      kind: ${{ steps.prep.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # 缓存不用 setup-java 的 cache: gradle（它在 Windows 上保存必败、也从未生效过）。
      # 改用官方 Gradle action：缓存 ~/.gradle（依赖仓库 + --build-cache 的任务输出），
      # 主键带 gradle 脚本哈希，restore-keys 兜底 —— 依赖微变也能吃到大头，
      # 命中后只有改动模块真正重编，安卓 job 的大头从冷构建变成增量。
      - uses: gradle/actions/setup-gradle@v4
      - name: 取加密 .so（同 run crypto 产物）
        uses: actions/download-artifact@v4
        with:
          name: crypto-android
          path: crypto/dist/android
      - name: 还原发布签名（未配 Secrets 时退回 Debug 包）
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.TAOTAO_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TAOTAO_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TAOTAO_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64// /}" ]; then
            echo "未配 ANDROID_KEYSTORE_BASE64：退回 Debug 包，仅验证工具链"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 诊断：只打印每个 Secret 的长度，绝不打印值。某项为 0 即说明该 Secret 为空或名字写错。
          echo "Secret 长度 — base64=${#ANDROID_KEYSTORE_BASE64} store=${#ANDROID_STORE_PASSWORD} alias=${#ANDROID_KEY_ALIAS} key=${#ANDROID_KEY_PASSWORD}"
          # 守卫：base64 有值就必须四项齐全，否则硬失败——绝不把空密码写进 local.properties
          # 伪装成 signed=true（那会在 packageRelease 报「password was incorrect」，误导排查）。
          missing=""
          [ -z "${ANDROID_STORE_PASSWORD// /}" ] && missing="ANDROID_STORE_PASSWORD"
          [ -z "${ANDROID_KEY_ALIAS// /}" ] && missing="${missing:+$missing,}ANDROID_KEY_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD// /}" ] && missing="${missing:+$missing,}ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "已配 ANDROID_KEYSTORE_BASE64 但以下签名 Secret 为空：$missing。请在仓库 Secrets 里补齐，名称须完全一致。" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > taotao-release.jks
          # printf 输出无 BOM：BOM 会让首行 key 读不到 → 空密码（Windows Set-Content 的坑，留着警示）。
          printf 'TAOTAO_STORE_PASSWORD=%s\nTAOTAO_KEY_ALIAS=%s\nTAOTAO_KEY_PASSWORD=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > local.properties
          # 本机先验一遍 store 密码，CI 早失败好过拖到 packageRelease。
          if [ -x "$JAVA_HOME/bin/keytool" ]; then
            if ! "$JAVA_HOME/bin/keytool" -list -keystore taotao-release.jks \
                 -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              echo "keytool 自检失败：store 密码或别名与 keystore 不符。" >&2
              exit 1
            fi
            echo "keytool 自检通过：keystore / 密码 / 别名 一致。"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: 生成本次运行唯一 Android 版本号
        run: |
          # version.properties 保持基线；用 GitHub Actions 运行号生成单调版本，
          # 避免每次干净 checkout 都重新产出同一个版本号。node 改写跨平台。
          node -e '
            const fs = require("fs");
            const run = parseInt(process.env.GITHUB_RUN_NUMBER, 10);
            let code = 0, name = "";
            for (const line of fs.readFileSync("version.properties", "utf8").split(/\r?\n/)) {
              const m = line.match(/^([^=]+)=(.*)$/);
              if (!m) continue;
              if (m[1] === "VERSION_CODE") code = parseInt(m[2], 10);
              if (m[1] === "VERSION_NAME") name = m[2];
            }
            code += run;
            const parts = name.split(".");
            parts[2] = String(parseInt(parts[2], 10) + run);
            fs.writeFileSync("version.properties", `VERSION_CODE=${code}\nVERSION_NAME=${parts.join(".")}\n`);
            console.log(`Android version => ${parts.join(".")} (${code})`);
          '
      - name: 构建 APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :androidApp:assembleRelease --build-cache --console=plain
          else
            ./gradlew :androidApp:assembleDebug --build-cache --console=plain
          fi
      - name: 整理版本号
        id: prep
        shell: bash
        run: |
          meta=$(find androidApp/build/outputs/apk -name output-metadata.json | head -1)
          vn=$(node -p "require('./$meta').elements[0].versionName" 2>/dev/null || echo unknown)
          vc=$(node -p "require('./$meta').elements[0].versionCode" 2>/dev/null || echo 0)
          apk=$(find androidApp/build/outputs/apk -name '*.apk' | head -1)
          case "$apk" in *release*) kind=release;; *) kind=debug;; esac
          echo "vn=$vn" >> "$GITHUB_OUTPUT"; echo "vc=$vc" >> "$GITHUB_OUTPUT"; echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/apk/**/output-metadata.json
          if-no-files-found: error

  # PLACEHOLDER_CLIENT_PUBLISH
  client-web:
    needs: [changes, purge]
    if: needs.changes.outputs.client == 'true'
    # 用 Linux：wasm 产物与构建平台无关。Windows runner 上 wasm-opt.cmd shim 偶发被占用
    # 导致进程启动失败才迁来；Linux 上同一任务也偶发「problem occurred starting process」
    # （重跑即愈），所以下面两处 gradle 调用都带自动重试。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # 缓存同 client-android：setup-java 的 cache: gradle 在本仓库从未生效过，
      # 用官方 Gradle action 显式缓存 ~/.gradle（npm 包仓库 + wasm 工具链 + 任务输出）。
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 锁文件解析有平台差异：Windows 侧生成的 kotlin-js-store 锁在 Linux
      # 会被 npm 改写，包锁校验任务直接判死（本 job 已固定在 Linux 跑，
      # 这里先自愈并把新锁回写仓库，之后锁文件以 Linux 解析为准）。
      # 注意 org.gradle.configureondemand=true 下直接调 :kotlinNpmInstall 会因
      # root 未注册任务而失败，所以要借 :webApp 的构建图并临时排除锁校验；
      # Kotlin 2.2 起锁校验任务拆分为 kotlinWasmStorePackageLock（旧名
      # kotlinStorePackageLock 已不存在，--exclude-task 会因歧义直接报错）。
      - name: 刷新 kotlin-js-store 锁文件（漂移时回写）
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :webApp:wasmJsBrowserDistribution -x :kotlinWasmStorePackageLock --build-cache --no-daemon; then break; fi
            echo "::warning::wasm 构建第 ${attempt} 次失败（wasm-opt 偶发启动问题），重试"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          if ! git diff --quiet --no-index kotlin-js-store/package-lock.json build/js/package-lock.json; then
            cp build/js/package-lock.json kotlin-js-store/package-lock.json
            # PR 上只刷新不落库：往 PR 分支推提交既打扰作者，fork PR 又没有写权限。
            # 漂移会在合并进 main 后的那次 push 运行里自动回写。
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "::warning::锁文件有漂移，PR 上不回写仓库；合并进 main 后由 push 运行自动刷新"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add kotlin-js-store
              git commit -m "build: CI 刷新 kotlin-js-store 锁文件（Linux 侧 npm 解析）[skip ci]"
              git push || echo "::warning::锁文件回写推送失败，下次运行重试"
            fi
          else
            echo "锁文件无漂移"
          fi
      - name: 构建 Kotlin/Wasm 分享播放器
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :webApp:wasmJsBrowserDistribution --build-cache --no-daemon; then exit 0; fi
            echo "::warning::wasm 构建第 ${attempt} 次失败（wasm-opt 偶发启动问题），重试"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: 打包并发布 share-player-latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd webApp/build/dist/wasmJs/productionExecutable && zip -qr "$OLDPWD/share-player.zip" .)
          gh release view share-player-latest >/dev/null 2>&1 \
            || gh release create share-player-latest --prerelease --title "Web 分享播放器" --notes "版本历史"
          gh release upload share-player-latest share-player.zip --clobber
      - name: 记录 Web 版本历史
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-log.sh share-player-latest "Web 分享播放器" "$(tr -d '[:space:]' < VERSION).${GITHUB_RUN_NUMBER}"

  client-publish:
    needs: [client-android]
    # 纯发布 job：PR 上整个跳过（否则会创建 latest Release 并删掉已有 APK 资产）。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN: ${{ needs.client-android.outputs.vn }}
      VC: ${{ needs.client-android.outputs.vc }}
      KIND: ${{ needs.client-android.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理产物
        run: |
          mkdir -p out
          apk=$(find artifacts/android-apk -name '*.apk' | head -1)
          asset="TaotaoMusic-${VN}-${KIND}.apk"
          cp "$apk" "out/$asset"
          # 构件上云：产出 metadata.json 供后端 webhook 补齐 versionCode/sha256。
          # 服务器据此下发代理直链，自身不再接收或下发 APK 字节。versionCode 公开无妨（非密钥）。
          sha=$(sha256sum "out/$asset" | awk '{print $1}')
          size=$(stat -c %s "out/$asset")
          notes=$(gh release view latest --json body -q '.body' 2>/dev/null || echo "")
          node -e '
            const [asset, vn, vc, sha, size, notes] = process.argv.slice(1);
            const fs = require("fs");
            fs.writeFileSync("out/metadata.json", JSON.stringify({
              versionCode: Number(vc), versionName: vn, sha256: sha,
              size: Number(size), apkAsset: asset, notes,
            }, null, 2));
          ' "$asset" "$VN" "$VC" "$sha" "$size" "$notes"
          cat out/metadata.json
          ls -la out
      - name: 更新滚动 latest（安卓客户端，记录版本历史）
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "安卓客户端" --notes "版本历史"
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null | grep -E '^TaotaoMusic-.*\.apk$' | while read -r old; do gh release delete-asset latest "$old" -y || true; done
          gh release upload latest out/* --clobber
          bash tools/release-log.sh latest "安卓客户端" "$VN"

  # Windows 桌面（Tauri + React）。crypto-src 变化也重建（src-tauri 直接依赖 core）。
  desktop:
    needs: [changes, purge]
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.crypto == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 是否配了更新签名私钥。没配也不让 desktop 构建变红——出无签名安装包、
      # 但不产更新清单（自动更新需配 Secret 后才启用）。
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SHA 固定理由同 crypto job。
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop
      - name: 安装前端依赖
        run: npm install
      - name: 自动版本号（根 VERSION 定 MAJOR.MINOR，PATCH=构建号）
        shell: bash
        run: |
          base=$(tr -d '[:space:]' < ../VERSION)
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='${base}.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync(f,JSON.stringify(j,null,2));console.log('desktop version =>',j.version)"
      # 图标（src-tauri/icons/）已提交入库，不再动态生成。
      # PR 上恒关更新产物：下面的 PR 构建步骤不传签名密钥，若 createUpdaterArtifacts
      # 仍为 true，tauri 会因缺密钥直接失败。push 且配了密钥时才保留（正式发布路径）。
      - name: 关闭更新产物（PR 恒关；push 时仅未配密钥才关）
        if: github.event_name != 'push' || env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.bundle.createUpdaterArtifacts=false;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo "::warning::本次不产更新清单（PR 验证运行，或未配置 TAURI_SIGNING_PRIVATE_KEY）。"
      # PR：只构建验证，不发布。tauri-action 省略 tagName/releaseName/releaseId 即为「只构建」。
      - name: 构建（PR：只验证不发布）
        if: github.event_name != 'push'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
      - name: 构建 + 签名 + 发布（含自动更新 latest.json）
        if: github.event_name == 'push' && env.HAS_UPDATER_KEY == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tagName: desktop-latest
          releaseName: 桌面(Tauri) 最新构建
          releaseBody: Windows Tauri 桌面端（自动更新已启用）。装 .msi 或 -setup.exe。
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
      - name: 构建 + 发布（未配密钥：无签名、无更新清单）
        if: github.event_name == 'push' && env.HAS_UPDATER_KEY != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          tagName: desktop-latest
          releaseName: 桌面(Tauri) 最新构建
          releaseBody: Windows Tauri 桌面端。配置 TAURI_SIGNING_PRIVATE_KEY 后启用自动更新。
          releaseDraft: false
          prerelease: true
      - name: 清理 desktop-latest 旧版本资产（只留本次 + latest.json）
        if: github.event_name == 'push' && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ver="$(tr -d '[:space:]' < ../VERSION).${GITHUB_RUN_NUMBER}"
          gh release view desktop-latest --json assets -q '.assets[].name' 2>/dev/null | while read -r a; do
            case "$a" in
              latest.json) : ;;
              *"$ver"*) : ;;
              *) echo "删除旧资产 $a"; gh release delete-asset desktop-latest "$a" -y || true ;;
            esac
          done
      - name: 记录桌面版本历史
        if: github.event_name == 'push' && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ../tools/release-log.sh desktop-latest "桌面客户端" "$(tr -d '[:space:]' < ../VERSION).${GITHUB_RUN_NUMBER}"



