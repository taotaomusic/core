# 2g 在 Kotlin 编译时会顶到堆上限反复 GC（CI 4 核 16G runner 上跑不满），4g 更从容。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Kotlin/Wasm 使用系统 npm 解析前端工具，避免额外依赖 Yarn 的 GitHub 发布附件。
kotlin.js.yarn=false
# 发布签名信息保存在本机 local.properties，不要提交到版本库

# CI/本地构建提速：任务输出缓存 + 并行 + 按需配置（GitHub Actions 缓存 ~/.gradle 复用）。
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
