# 2g 在 Kotlin 编译时会顶到堆上限反复 GC（CI 4 核 16G runner 上跑不满），4g 更从容。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Kotlin/Wasm 使用系统 npm 解析前端工具，避免额外依赖 Yarn 的 GitHub 发布附件。
kotlin.js.yarn=false
# 发布签名信息保存在本机 local.properties，不要提交到版本库
# AGP 9 默认内置 Kotlin（捆绑 KGP 2.2.10）。本项目 KSP/KMP/compose 插件体系仍按
# KGP 独立插件组织，先退回传统模式；内置 Kotlin 迁移在 AGP 10 前单独做。
android.builtInKotlin=false
# AGP 9 默认 android.newDsl=true，与 KGP multiplatform 的 androidTarget() 不兼容
# （LibraryExtension 无法转型 BaseExtension，CI 实证）。player-ui/shared 迁
# com.android.kotlin.multiplatform.library 在 AGP 10 前单独做，先走官方过渡开关。
android.newDsl=false
# Miuix 0.9.x AAR 元数据钉 minCompileSdk=37（上游用 SDK 37 编译），本项目随之抬到 37。
android.suppressUnsupportedCompileSdk=37
# 过渡开关与二进制插件触发的 AGP 弃用告警收编（关键字取自 AGP 告警原文给出的建议值）：
# - UNSUPPORTED_PROJECT_OPTION_USE：builtInKotlin=false / newDsl=false 两个过渡开关本身的
#   「选项已弃用」告警 —— 迁移在 AGP 10 前单独做，完成前开关必须保留；
# - DEPRECATED_DSL：variant API（applicationVariants/libraryVariants 等）弃用告警，来自
#   AGP 内部插件与 KGP 的二进制代码，仓库源码已零引用、无处可改。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

# CI/本地构建提速：任务输出缓存 + 并行（GitHub Actions 缓存 ~/.gradle 复用）。
# configureondemand 已关：KGP 明确警告 wasmJs target 不支持按需配置（KT-52074，
# "may lead to unpredictable and inconsistent behaviour"），为省一点配置期时间
# 换构建不确定性不值得；KMP Android 迁移（com.android.kotlin.multiplatform.library）
# 落地后如需再评估。
org.gradle.caching=true
org.gradle.parallel=true
